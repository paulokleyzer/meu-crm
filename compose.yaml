services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meu_crm
      POSTGRES_USER: meu_crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U meu_crm -d meu_crm"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
volumes:
  crm_pgdata:
