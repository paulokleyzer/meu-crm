[build]
command = "npm run build:netlify"
publish = ".next"
# Git-connected builds check this before installing/provisioning services.
ignore = "node scripts/netlify-ignore.mjs"

[build.environment]
NODE_VERSION = "24"
NPM_FLAGS = "--include=dev"

[database.migrations]
path = "netlify/database/migrations"

[[plugins]]
package = "@netlify/plugin-nextjs"

[dev]
command = "npm run dev"
targetPort = 3000
port = 8888
autoLaunch = false

[functions]
node_bundler = "esbuild"
