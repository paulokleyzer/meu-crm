services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meu_crm
      POSTGRES_USER: meu_crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U meu_crm -d meu_crm"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL com host db e porta 5432}
      CRM_ACCESS_MODE: ${CRM_ACCESS_MODE:-basic}
      CRM_BASIC_USER: ${CRM_BASIC_USER:?Defina CRM_BASIC_USER}
      CRM_BASIC_PASSWORD: ${CRM_BASIC_PASSWORD:?Defina CRM_BASIC_PASSWORD}
      CRM_ALLOWED_ORIGIN: ${CRM_ALLOWED_ORIGIN:?Defina a origem HTTPS}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
volumes:
  crm_pgdata:
